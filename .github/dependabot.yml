version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    ignore:
      # The types follow the Node version the site builds on (22 in CI, tsconfig node24),
      # not the newest Node: move them by hand together with that version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # The whole toolchain is build-time only (the site ships static files): minor and patch
    # updates of dev dependencies come as one PR, majors and runtime dependencies separately.
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
