# Builds the site and publishes dist/ to the `site` branch (one orphan commit, force-pushed
# only when the files change). The VPS only fetches that branch and copies the files, so no
# Node, pnpm or npm package ever runs on the server (kostecki-dev-infra, docs/LANDING.md).
#
# The daily run refreshes the archive counts and the date-derived values frozen into the
# prerendered HTML. ARCHIVE_STRICT=1: a GitHub API outage fails the run instead of
# publishing a stale count; the site keeps its last build.
name: Build site

on:
  push:
    branches: [master]
  # Pull requests only build and test; nothing is published.
  pull_request:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

concurrency:
  group: build-site
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # npm packages run in this job, so its token can only read.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@11.5.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          ARCHIVE_STRICT: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm build
          test -s dist/index.html

      # After the build: the app (and so its tests) imports src/generated/archive.json,
      # which the build writes.
      - name: Test
        run: pnpm test

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only git runs here: no checkout of the repo, no packages.
    permissions:
      contents: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - name: Push to the site branch when the files changed
        working-directory: site
        env:
          TOKEN: ${{ github.token }}
        run: |
          test -s index.html
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "site: build of ${GITHUB_SHA::7} (${GITHUB_EVENT_NAME})"
          if git fetch -q --depth 1 "$remote" refs/heads/site 2>/dev/null &&
             [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            echo "Built files are identical to the site branch, nothing to publish."
            exit 0
          fi
          git push -q -f "$remote" HEAD:refs/heads/site
          echo "Published $(git rev-parse --short HEAD) to the site branch."
