services:
  landing:
    image: nginx:alpine
    container_name: landing
    restart: unless-stopped
    volumes:
      # www/ is a copy of dist/ that the infra deploy scripts sync after a successful build,
      # so the site never serves a half-written dist/ while pnpm build runs.
      - ./www:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.landing.rule=Host(`kostecki.dev`) || Host(`www.kostecki.dev`)
      - traefik.http.routers.landing.entrypoints=websecure
      - traefik.http.routers.landing.tls.certresolver=letsencrypt
      - traefik.http.services.landing.loadbalancer.server.port=80

networks:
  proxy:
    external: true
