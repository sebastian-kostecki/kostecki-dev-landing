server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Nagłówki bezpieczeństwa. TLS kończy Traefik, więc HSTS idzie tu tylko jako
    # nagłówek odpowiedzi (bez includeSubDomains/preload).
    # REGUŁA: add_header w bloku location kasuje wszystkie add_header odziedziczone
    # z server — dlatego wszystkie nagłówki są tutaj, a żaden location nie może
    # mieć własnego add_header. `always` dodaje je także do odpowiedzi 404.
    # style-src 'unsafe-inline' zostaje, bo @iconify/vue i Vue ustawiają atrybuty style w DOM.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
